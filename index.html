<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxsys Game Release Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-light:#2F5597; --navy-pale:#EAF1FB;
    --text:#1F1F1F; --muted:#7F7F7F; --border:#E1E4E8; --bg:#F5F6F8;
    --green-bg:#C6E0B4; --green-fg:#375623;
    --yellow-bg:#FFF2CC; --yellow-fg:#806000;
    --red-bg:#F8CBAD; --red-fg:#833C00;
    --purple-bg:#E4D9F0; --purple-fg:#4C2F72;
    --gray-bg:#E7E6E6; --gray-fg:#404040;
    --blue-bg:#BDD7EE; --blue-fg:#1F4E78;
    --col-band-light:#F2F2F2; --col-band-dark:#D9D9D9; --col-sep:#BFBFBF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Aptos,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .hidden{display:none !important;}
  body.mode-view .editor-only{display:none !important;}

  #errorBanner{position:fixed;top:0;left:0;right:0;background:#B00020;color:#fff;padding:10px 20px;font-size:12.5px;font-weight:600;z-index:2000;text-align:center;}
  #errorBanner button{margin-left:14px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:3px 10px;border-radius:4px;cursor:pointer;font-weight:600;}

  /* ---------- PIN GATE ---------- */
  #pinGate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;z-index:1000;}
  .pin-box{background:#fff;padding:40px 36px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:340px;text-align:center;}
  .pin-box h1{font-size:20px;margin:0 0 4px;color:var(--navy);}
  .pin-box p{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .pin-box input{width:100%;font-size:22px;letter-spacing:8px;text-align:center;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;}
  .pin-box button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .pin-box button:hover{background:var(--navy-light);}
  .pin-box button:disabled{opacity:.6;cursor:default;}
  .pin-error{color:#B00020;font-size:13px;height:16px;margin-bottom:8px;}
  .pin-hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  header .sub{font-size:11px;color:#c9d6ec;font-weight:400;}
  .header-right{display:flex;align-items:center;gap:8px;}
  .badge-pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;}
  .sync-online{background:#375623;color:#C6E0B4;}
  .sync-local{background:#833C00;color:#F8CBAD;}
  .mode-editor-badge{background:#4C2F72;color:#E4D9F0;}
  .mode-viewer-badge{background:#1F4E78;color:#BDD7EE;}
  .lockBtn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 12px;border-radius:6px;font-size:11.5px;cursor:pointer;}
  .lockBtn:hover{background:rgba(255,255,255,0.22);}
  nav{display:flex;gap:4px;background:#16294A;padding:0 20px;overflow-x:auto;}
  nav button{background:none;border:none;color:#c9d6ec;padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  nav button.active{color:#fff;border-bottom-color:#6FA8DC;}
  nav button:hover{color:#fff;}
  main{padding:20px 24px 60px;max-width:1600px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .panel-head h2{margin:0;color:var(--navy);font-size:20px;}
  .panel-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--navy-light);}
  .btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn.danger{background:#fff;color:#B00020;border:1px solid #B00020;padding:5px 9px;}
  .search{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;min-width:200px;}
  .chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  label.checklabel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;}

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto;background:#fff;border-radius:10px;border:1px solid var(--border);}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  thead th{background:var(--navy);color:#fff;padding:10px 8px;text-align:left;position:sticky;top:0;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}

  /* ---------- FROZEN HEADER + RESIZABLE COLUMNS (Release Calendar) ---------- */
  .freeze-wrap{max-height:68vh;overflow-y:auto;}
  #table-release_calendar{table-layout:fixed;}
  #table-release_calendar thead th{overflow:hidden;text-overflow:ellipsis;z-index:2;}
  #table-release_calendar thead th.sortable{padding-right:16px;}
  #table-release_calendar tbody td{overflow:hidden;text-overflow:ellipsis;}
  .col-resize-handle{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6;}
  .col-resize-handle:hover, .col-resize-handle:active{background:rgba(255,255,255,0.35);}
  tbody td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:nth-child(even){background:#FAFBFC;}
  tbody tr:hover{background:var(--navy-pale);}
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{background:var(--navy-light);}
  thead th .sort-arrow{margin-left:4px;opacity:.85;font-size:10px;}
  tbody tr.dragging{opacity:.35;}
  tbody tr.drag-over-top{box-shadow: inset 0 3px 0 0 var(--navy-light);}
  tbody tr.drag-over-bottom{box-shadow: inset 0 -3px 0 0 var(--navy-light);}
  td.rowdrag{cursor:grab;text-align:center;color:var(--muted);width:22px;font-size:14px;letter-spacing:-2px;}
  td.rowdrag:active{cursor:grabbing;}
  .calendar-filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .calendar-filterbar select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:#fff;color:var(--text);}
  .drag-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  td input, td select, td textarea{
    width:100%;border:1px solid transparent;background:transparent;padding:6px 5px;font-size:12.5px;border-radius:4px;font-family:inherit;color:var(--text);
  }
  td input:hover, td select:hover, td textarea:hover{border-color:var(--border);}
  td input:focus, td select:focus, td textarea:focus{border-color:var(--navy-light);background:#fff;outline:none;}
  td textarea{resize:vertical;min-height:32px;}
  .col-num input{text-align:right;}
  .rowdel{text-align:center;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .ro-field{padding:6px 5px;font-size:12.5px;min-height:16px;}
  .ro-field a{color:var(--navy-light);}

  /* ---------- DASHBOARD ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .kpi .val{font-size:32px;font-weight:800;color:var(--navy);margin-top:6px;}
  .dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .chart-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}
  .chart-card h3{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .chart-card canvas{max-height:240px;}
  .milestone-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}
  .milestone-card h3{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .milestone{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .milestone:last-child{border-bottom:none;}
  .milestone .m-date{font-weight:700;color:var(--navy);min-width:66px;}
  .milestone .m-game{flex:1;padding:0 8px;}
  .milestone .m-type{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue-fg);font-weight:700;white-space:nowrap;}
  .empty-note{color:var(--muted);font-size:12.5px;padding:10px 0;}

  /* ---------- GO-TO-MARKET ---------- */
  #gtmGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;}
  .gtm-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;}
  .gtm-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .gtm-card-head h3{margin:0;font-size:15.5px;color:var(--navy);}
  .gtm-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .gtm-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .gtm-pct{text-align:right;}
  .gtm-pct .num{font-size:22px;font-weight:800;color:var(--navy);}
  .gtm-pct .txt{font-size:9.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px;}
  .progress-bar{height:6px;background:#ECECEC;border-radius:4px;overflow:hidden;margin-top:14px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#6FA8DC,#375623);border-radius:4px;}

  .stepper{display:flex;position:relative;margin:18px 0 6px;}
  .stepper::before{content:'';position:absolute;top:15px;left:8%;right:8%;height:2px;background:#E1E4E8;z-index:0;}
  .step{flex:1;text-align:center;position:relative;z-index:1;}
  .step .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid #E1E4E8;background:#fff;}
  .step.done .dot{background:var(--green-bg);border-color:var(--green-fg);color:var(--green-fg);}
  .step.scheduled .dot{background:var(--blue-bg);border-color:var(--blue-fg);color:var(--blue-fg);}
  .step.progress .dot{background:var(--yellow-bg);border-color:var(--yellow-fg);color:var(--yellow-fg);}
  .step.blocked .dot{background:var(--red-bg);border-color:var(--red-fg);color:var(--red-fg);}
  .step.na .dot{background:#fafafa;border-color:#eee;color:#ccc;}
  .step.pending .dot{background:#fff;border-color:#ddd;color:#bbb;}
  .step .label{font-size:9.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.2px;}
  .step .value{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .gtm-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  .gtm-notes-preview{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .gtm-actions{display:flex;gap:6px;flex-shrink:0;}
  .gtm-edit-panel{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);display:none;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .gtm-edit-panel.open{display:grid;}
  .gtm-edit-panel .field-block.full{grid-column:1/-1;}
  .gtm-edit-panel label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}
  .gtm-edit-panel input, .gtm-edit-panel select, .gtm-edit-panel textarea{
    width:100%;border:1px solid var(--border);background:#fff;padding:7px 8px;font-size:12.5px;border-radius:6px;font-family:inherit;
  }
  .gtm-edit-panel textarea{resize:vertical;min-height:50px;}
  .gtm-summary{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;display:flex;gap:28px;flex-wrap:wrap;}
  .gtm-summary .item{text-align:left;}
  .gtm-summary .item .n{font-size:24px;font-weight:800;color:var(--navy);}
  .gtm-summary .item .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;}

  /* ---------- SETTINGS ---------- */
  .settings-box{max-width:480px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;}
  .settings-box label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:6px;}
  .settings-box input{width:100%;padding:9px;border:1px solid var(--border);border-radius:6px;margin-bottom:16px;font-size:13px;}

  #localBanner{background:var(--yellow-bg);color:var(--yellow-fg);padding:8px 24px;font-size:12.5px;font-weight:600;text-align:center;}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:11.5px;}

  @media (max-width:900px){ .dash-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="errorBanner" class="hidden">
  <span id="errorBannerText"></span>
  <button onclick="document.getElementById('errorBanner').classList.add('hidden')">Dismiss</button>
</div>

<!-- ============ PIN GATE ============ -->
<div id="pinGate">
  <div class="pin-box">
    <h1>Galaxsys Game Release Tracker</h1>
    <p>Enter your PIN to continue</p>
    <div class="pin-error" id="pinError"></div>
    <input type="password" id="pinInput"
