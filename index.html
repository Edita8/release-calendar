<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxsys Game Release Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-light:#2F5597; --navy-pale:#EAF1FB;
    --text:#1F1F1F; --muted:#7F7F7F; --border:#E1E4E8; --bg:#F5F6F8;
    --green-bg:#C6E0B4; --green-fg:#375623;
    --yellow-bg:#FFF2CC; --yellow-fg:#806000;
    --red-bg:#F8CBAD; --red-fg:#833C00;
    --purple-bg:#E4D9F0; --purple-fg:#4C2F72;
    --gray-bg:#E7E6E6; --gray-fg:#404040;
    --blue-bg:#BDD7EE; --blue-fg:#1F4E78;
    --col-band-light:#F2F2F2; --col-band-dark:#D9D9D9; --col-sep:#BFBFBF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Aptos,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .hidden{display:none !important;}
  body.mode-view .editor-only{display:none !important;}

  #errorBanner{position:fixed;top:0;left:0;right:0;background:#B00020;color:#fff;padding:10px 20px;font-size:12.5px;font-weight:600;z-index:2000;text-align:center;}
  #errorBanner button{margin-left:14px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:3px 10px;border-radius:4px;cursor:pointer;font-weight:600;}

  #pinGate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;z-index:1000;}
  .pin-box{background:#fff;padding:40px 36px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:340px;text-align:center;}
  .pin-box h1{font-size:20px;margin:0 0 4px;color:var(--navy);}
  .pin-box p{font-size:13px;color:var(--muted);margin:0 0 20px;}
  .pin-box input{width:100%;font-size:22px;letter-spacing:8px;text-align:center;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;}
  .pin-box button{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .pin-box button:hover{background:var(--navy-light);}
  .pin-box button:disabled{opacity:.6;cursor:default;}
  .pin-error{color:#B00020;font-size:13px;height:16px;margin-bottom:8px;}
